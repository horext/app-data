name: Reportar un plan de estudios incorrecto
description: Informa asignaturas faltantes, adicionales o con datos incorrectos.
title: "[Plan de estudios]: "
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudar a mejorar los datos públicos de Horext.

        Incluye fuentes oficiales cuando sea posible y no compartas nombres, correos ni otros datos personales.

  - type: input
    id: speciality
    attributes:
      label: Especialidad
      description: Nombre de la especialidad.
      placeholder: "Ejemplo: Ingeniería de Sistemas"
    validations:
      required: true

  - type: input
    id: study_plan
    attributes:
      label: Plan de estudios
      description: Código y nombre del plan, o solo el nombre si no tiene código.
      placeholder: "Ejemplo: SIS-2026 - Plan 2026"
    validations:
      required: true

  - type: input
    id: valid_from
    attributes:
      label: Vigente desde
      description: Fecha desde la cual el plan está vigente, si se conoce.
      placeholder: "Ejemplo: 2026-01-01"

  - type: dropdown
    id: problem_type
    attributes:
      label: Tipo de problema
      description: Selecciona todas las opciones que correspondan.
      multiple: true
      options:
        - Falta una asignatura en el plan
        - Una asignatura no pertenece al plan
        - El ciclo, código o nombre de una asignatura es incorrecto
        - Otro problema
    validations:
      required: true

  - type: textarea
    id: affected_subjects
    attributes:
      label: Asignaturas afectadas
      description: Incluye el código y nombre de cada asignatura afectada.
      placeholder: |
        - CS101 — Introducción a la Programación
        - MA201 — Matemática II
    validations:
      required: true

  - type: textarea
    id: expected_change
    attributes:
      label: Corrección esperada
      description: Explica qué información debería agregarse, retirarse o modificarse.
    validations:
      required: true

  - type: input
    id: official_source
    attributes:
      label: Fuente oficial
      description: Enlace al documento o página oficial que respalda la corrección.
      placeholder: "https://..."

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: Confirmo que este reporte no contiene datos personales.
          required: true
