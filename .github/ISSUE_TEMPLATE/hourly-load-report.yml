name: Reportar una carga horaria incorrecta
description: Informa secciones, horarios o aulas faltantes o incorrectos.
title: "[Carga horaria]: "
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudar a mejorar los datos públicos de Horext.

        Incluye fuentes oficiales cuando sea posible y no compartas nombres, correos ni otros datos personales.

  - type: input
    id: speciality
    attributes:
      label: Especialidad
      description: Nombre de la especialidad asociada a la carga horaria.
      placeholder: "Ejemplo: Ingeniería de Sistemas"
    validations:
      required: true

  - type: input
    id: hourly_load
    attributes:
      label: Carga horaria
      description: Periodo o nombre de la carga horaria donde aparece el problema.
      placeholder: "Ejemplo: 2026-2"
    validations:
      required: true

  - type: input
    id: course
    attributes:
      label: Asignatura
      description: Código y nombre de la asignatura usada para identificar sus horarios.
      placeholder: "Ejemplo: CS101 — Introducción a la Programación"
    validations:
      required: true

  - type: dropdown
    id: problem_type
    attributes:
      label: Tipo de problema
      description: Selecciona todas las opciones que correspondan.
      multiple: true
      options:
        - Falta una sección
        - Una sección no pertenece a la carga horaria
        - El horario de una sesión es incorrecto
        - El aula de una sesión es incorrecta
        - Otro problema
    validations:
      required: true

  - type: textarea
    id: affected_schedules
    attributes:
      label: Secciones u horarios afectados
      description: Indica las secciones y horarios incorrectos o faltantes.
      placeholder: |
        Sección A — lunes 08:00-10:00
        Sección B — miércoles 10:00-12:00
    validations:
      required: true

  - type: textarea
    id: expected_change
    attributes:
      label: Corrección esperada
      description: Explica qué información debería agregarse, retirarse o modificarse.
    validations:
      required: true

  - type: input
    id: official_source
    attributes:
      label: Fuente oficial
      description: Enlace al documento o página oficial que respalda la corrección.
      placeholder: "https://..."

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: Confirmo que este reporte no contiene datos personales.
          required: true
