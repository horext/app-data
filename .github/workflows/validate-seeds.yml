name: Validate seed CSV files

on:
  pull_request:
    paths:
      - "seeds/**.csv"
      - "scripts/validate_seeds.py"
      - ".github/workflows/validate-seeds.yml"
  push:
    branches:
      - main
    paths:
      - "seeds/**.csv"
      - "scripts/validate_seeds.py"
      - ".github/workflows/validate-seeds.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/validate_seeds.py
